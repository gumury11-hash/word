<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>단어 학습기</title>
    <style>
        :root {
            --bg-1: #edf3f8;
            --bg-2: #d3dbe4;
            --metal-1: #f9fbff;
            --metal-2: #e3e9f0;
            --metal-3: #c7d0dc;
            --metal-4: #a1adbb;
            --metal-5: #697888;
            --steel-1: #4d5c6d;
            --steel-2: #2d3744;
            --steel-3: #1b2430;
            --ice-1: #dfeaf8;
            --ice-2: #bfd3ee;
            --panel-edge: rgba(147, 166, 186, 0.85);
            --panel-shadow: rgba(31, 41, 55, 0.12);
            --text-color: #243041;
            --muted: #5c6777;
            --soft: #7c8797;
            --primary-color: #435163;
            --primary-hover: #1d2733;
            --success-color: #586a7b;
            --warning-color: #76859a;
            --error-color: #b12d2d;
            --button-text: #f8fbff;
            --glow: rgba(136, 168, 214, 0.22);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at top, rgba(255,255,255,0.82), rgba(255,255,255,0) 36%),
                linear-gradient(180deg, var(--bg-1), var(--bg-2));
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            -webkit-text-size-adjust: 100%;
        }

        .container {
            max-width: 100%;
            width: 100%;
            margin: 0 auto;
            background: linear-gradient(180deg, rgba(255,255,255,0.78), rgba(224,231,238,0.82));
            padding: 18px 16px 16px;
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.9);
            box-shadow: 0 18px 30px var(--panel-shadow), inset 0 1px 0 rgba(255,255,255,0.85);
            box-sizing: border-box;
            overflow-x: hidden;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 20px;
            margin-bottom: 18px;
            word-break: keep-all;
            letter-spacing: 0.04em;
            font-weight: 900;
            text-shadow: 0 1px 0 rgba(255,255,255,0.8);
        }

        .api-key-section,
        .control-panel,
        .word-card,
        .history-item {
            background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(228,234,240,0.92));
            border: 1px solid var(--panel-edge);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 10px 18px rgba(15, 23, 42, 0.04);
        }

        .api-key-section {
            padding: 15px;
            border-radius: 18px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .api-key-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .api-key-row input,
        .form-group select,
        .writing-input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid rgba(203, 213, 225, 0.8);
            border-radius: 12px;
            font-size: 14px;
            color: var(--text-color);
            background: rgba(255,255,255,0.9);
            box-sizing: border-box;
            outline: none;
        }

        .api-key-row input:focus,
        .form-group select:focus,
        .writing-input:focus {
            border-color: rgba(107, 114, 128, 0.8);
            box-shadow: 0 0 0 3px rgba(107, 114, 128, 0.08);
        }

        .btn-api,
        .help-trigger-btn,
        .btn-load,
        .btn-all-repeat,
        .btn-group button,
        .btn-delete-icon,
        .modal-close {
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }

        .btn-api {
            background: linear-gradient(180deg, #dfeaf8, #aebed0);
            color: var(--steel-3);
            border: 1px solid rgba(132, 146, 166, 0.9);
            padding: 12px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 10px 18px rgba(76, 92, 115, 0.12);
        }
        .btn-api:hover,
        .help-trigger-btn:hover,
        .btn-load:hover,
        .btn-all-repeat:hover,
        .btn-group button:hover,
        .modal-close:hover,
        .btn-delete-icon:hover {
            transform: translateY(-1px);
            filter: brightness(1.02);
        }

        .api-status {
            margin-top: 8px;
            font-size: 12px;
            font-weight: bold;
            color: var(--error-color);
            word-break: break-all;
        }

        .help-trigger-btn {
            background: linear-gradient(180deg, #edf5ff, #d6e1ee);
            color: var(--steel-3);
            border: 1px solid rgba(143, 162, 186, 0.8);
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 800;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.38);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
            box-sizing: border-box;
        }

        .modal-content {
            background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(241,245,249,0.9));
            padding: 20px;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 18px 30px rgba(15,23,42,0.12);
            position: relative;
            line-height: 1.6;
            border: 1px solid rgba(203, 213, 225, 0.8);
            box-sizing: border-box;
        }

        .modal-close {
            position: absolute;
            top: 15px; right: 15px;
            background: rgba(255,255,255,0.7);
            border: 1px solid rgba(203,213,225,0.9);
            font-size: 18px;
            cursor: pointer;
            color: #4b5563;
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 18px;
            box-sizing: border-box;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 700;
            margin-bottom: 5px;
            font-size: 13px;
            color: var(--text-color);
        }

        select, button {
            padding: 12px;
            font-size: 15px;
            border-radius: 12px;
            outline: none;
            box-sizing: border-box;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-load {
            background: linear-gradient(180deg, var(--steel-1), var(--steel-2));
            color: var(--button-text);
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            padding: 14px;
            box-sizing: border-box;
            border: 1px solid rgba(123, 138, 156, 0.9);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 12px 20px rgba(45, 55, 68, 0.14);
        }
        .btn-load:disabled { background: linear-gradient(180deg, #dfe5ec, #c7d1db); color: #75839a; cursor: not-allowed; box-shadow: none; }

        .btn-all-repeat {
            background: linear-gradient(180deg, #7a8695, #4f5d70);
            color: var(--button-text);
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            padding: 14px;
            box-sizing: border-box;
            border: 1px solid rgba(123, 138, 156, 0.9);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 12px 20px rgba(99, 115, 136, 0.12);
        }
        .btn-all-repeat:disabled { background: linear-gradient(180deg, #dfe5ec, #c7d1db); color: #75839a; cursor: not-allowed; box-shadow: none; }

        .word-card {
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        .word-header {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
        }

        @media (min-width: 480px) {
            .word-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .word-title {
            font-size: 17px;
            font-weight: 800;
            color: #111827;
            word-break: break-all;
        }

        .btn-group {
            display: flex;
            gap: 6px;
        }

        .btn-group button {
            flex: 1;
            padding: 8px 10px;
            font-size: 13px;
            cursor: pointer;
            background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(219,226,234,0.96));
            border: 1px solid rgba(164, 176, 192, 0.9);
            border-radius: 10px;
            color: var(--steel-2);
            font-weight: 800;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
        }

        .writing-area {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
        }
        .writing-area label {
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 3px;
        }
        .writing-input {
            padding: 10px;
            border: 1px dashed rgba(148, 163, 184, 0.9);
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
            background: rgba(255,255,255,0.85);
        }

        #historySection {
            margin-top: 30px;
            border-top: 2px solid rgba(203, 213, 225, 0.9);
            padding-top: 15px;
            box-sizing: border-box;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .history-item {
            border-radius: 16px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            gap: 10px;
        }

        .history-content {
            flex: 1;
            cursor: pointer;
            word-break: break-all;
        }

        .history-content:active {
            opacity: 0.7;
        }

        .history-time {
            font-weight: 800;
            font-size: 14px;
            color: #111827;
            margin-bottom: 2px;
            display: block;
        }

        .history-desc {
            font-size: 11px;
            color: var(--muted);
            line-height: 1.3;
        }

        .btn-delete-icon {
            background: linear-gradient(180deg, #f5f8fc, #dfe6ee);
            border: 1px solid rgba(162, 173, 190, 0.8);
            color: var(--steel-3);
            font-size: 16px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 10px;
            flex-shrink: 0;
            font-weight: 800;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>단어학습</h1>

    <div id="apiKeySection" class="api-key-section">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <label for="apiKeyInput"><strong>Google Gemini API 키 입력</strong></label>
            <button class="help-trigger-btn" onclick="openHelpModal()">도움말</button>
        </div>
        <div class="api-key-row">
            <input type="password" id="apiKeyInput" placeholder="AIzaSy... 키 입력">
            <button class="btn-api" onclick="saveApiKey()">키 등록하기</button>
        </div>
        <div id="apiStatus" class="api-status">⚠️ API 키가 등록되지 않았습니다.</div>
    </div>

    <div id="helpModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeHelpModal()">✕</button>
            <h3 style="margin-top: 0; color: #0284c7; font-size: 18px;">💡 API 키 발급 방법</h3>
            <ol style="padding-left: 20px; font-size: 13px;">
                <li><strong>Google AI Studio 접속:</strong> (<a href="https://aistudio.google.com/" target="_blank">aistudio.google.com</a>) 로그인</li>
                <li><strong>API 키 생성:</strong> 상단/좌측 <strong>'Get API key'</strong> 클릭</li>
                <li><strong>복사 후 등록:</strong> 생성된 키(<code>AIzaSy...</code>)를 복사해 입력창에 붙여넣기</li>
            </ol>
        </div>
    </div>

    <div class="control-panel">
        <div class="form-group">
            <label for="langSelect">언어 선택</label>
            <select id="langSelect">
                <option value="en-US">영어</option>
                <option value="ja-JP">일본어</option>
                <option value="zh-CN">중국어</option>
                <option value="es-ES">스페인어</option>
                <option value="fr-FR">프랑스어</option>
                <option value="de-DE">독일어</option>
            </select>
        </div>

        <div class="form-group">
            <label for="levelSelect">난이도 선택</label>
            <select id="levelSelect">
                <option value="beginner">초급</option>
                <option value="intermediate">중급</option>
                <option value="advanced">고급</option>
            </select>
        </div>

        <div class="form-group">
            <label for="studyTypeSelect">학습 종류</label>
            <select id="studyTypeSelect">
                <option value="word">단어</option>
                <option value="phrase">표현</option>
                <option value="sentence">문장</option>
                <option value="listening">듣기</option>
            </select>
        </div>

        <div class="form-group">
            <label for="situationSelect">상황 종류</label>
            <select id="situationSelect">
                <option value="travel">공항/여행</option>
                <option value="business">비즈니스/회사</option>
                <option value="daily">일상/식사</option>
                <option value="emergency">비상/사건</option>
            </select>
        </div>
    </div>

    <div class="action-buttons">
        <button id="loadBtn" class="btn-load" onclick="loadWords()" disabled>학습 단어 생성</button>
        <button id="allRepeatBtn" class="btn-all-repeat" onclick="playAllWords()" disabled>전체 반복듣기</button>
    </div>

    <div id="wordListContainer">
        <p style="text-align: center; color: #6b7280; font-size: 13px;">API 키 등록 후 단어장을 생성해 주세요.</p>
    </div>

    <div id="historySection">
        <h3 style="font-size: 16px; margin-bottom: 5px;">학습 기록 관리</h3>
        <p style="font-size: 11px; color: #6b7280; margin-top: 0; margin-bottom: 10px;">기록을 터치하면 다시 공부할 수 있습니다.</p>
        <div id="historyListContainer" class="history-list">
            <div style="color: #6b7280; font-size: 13px; text-align: center; padding: 10px;">기록이 없습니다.</div>
        </div>
    </div>
</div>

<script>
    let userApiKey = "";
    let currentLoadedWords = [];

    const studyTypeMap = {
        word: { label: '단어', build: (items) => items },
        phrase: { label: '표현', build: (items) => items.map((item, idx) => ({ ...item, word: `${item.word} / ${item.meaning}` })) },
        sentence: {
            label: '문장',
            build: (items) => items.map((item, idx) => ({
                ...item,
                word: `${item.word}를(을) 활용한 문장 예시: "${item.word} is useful in this situation."`,
                meaning: item.meaning
            }))
        },
        listening: { label: '듣기', build: (items) => items }
    };

        emergency: {
            beginner: [
                {word: "Help", meaning: "도와줘"}, {word: "Fire", meaning: "불화재"}, {word: "Pain", meaning: "통증"}, 
                {word: "Hurt", meaning: "다침"}, {word: "Lost", meaning: "길잃음"}, {word: "Run", meaning: "도망치다"}, 
                {word: "Safe", meaning: "안전함"}, {word: "Call", meaning: "전화"}, {word: "Stop", meaning: "멈춰"}, {word: "Bad", meaning: "나쁨"},
                {word: "Sick", meaning: "아픈"}, {word: "Bleed", meaning: "출혈하다"}, {word: "Trap", meaning: "갇히다"}, {word: "Fear", meaning: "공포"}
            ],
            intermediate: [
                {word: "Hospital", meaning: "병원"}, {word: "Accident", meaning: "사고"}, {word: "Police", meaning: "경찰"}, 
                {word: "Danger", meaning: "위험"}, {word: "Medicine", meaning: "약"}, {word: "Warning", meaning: "경고"}, 
                {word: "Ambulance", meaning: "구급차"}, {word: "Stolen", meaning: "도난"}, {word: "Urgent", meaning: "긴급"}, {word: "Shelter", meaning: "대피소"},
                {word: "Disaster", meaning: "재난"}, {word: "Outbreak", meaning: "발병/발생"}, {word: "Security", meaning: "보안/경비"}, {word: "Casualty", meaning: "사상자"}
            ],
            advanced: [
                {word: "Emergency", meaning: "비상사태"}, {word: "Concussion", meaning: "뇌진탕"}, {word: "Evacuation", meaning: "대피피난"}, 
                {word: "Intervention", meaning: "조치개입"}, {word: "Unconscious", meaning: "의식불명"}, {word: "Catastrophe", meaning: "대참사"}, 
                {word: "Investigation", meaning: "조사수사"}, {word: "Pharmaceutical", meaning: "제약의"}, {word: "Recommendation", meaning: "권고"}, {word: "Vulnerability", meaning: "취약성"},
                {word: "Contamination", meaning: "오염"}, {word: "Unpredictable", meaning: "예측불가능한"}, {word: "Paramedic", meaning: "응급구조사"}
            ]
        }
    };

    window.onload = function() {
        const savedKey = localStorage.getItem("gemini_flash_lite_key");
        if (savedKey) {
            userApiKey = savedKey;
            applyRegisteredState();
        }
    };

    function saveApiKey() {
        const inputVal = document.getElementById('apiKeyInput').value.trim();
        if (!inputVal) {
            alert("유효한 API 키를 입력해주세요.");
            return;
        }
        userApiKey = inputVal;
        localStorage.setItem("gemini_flash_lite_key", userApiKey);
        applyRegisteredState();
        alert("API 키가 등록되었습니다.");
    }

    function applyRegisteredState() {
        const section = document.getElementById('apiKeySection');
        if (section) section.style.display = 'none';
        
        document.getElementById('loadBtn').disabled = false;
        document.getElementById('loadBtn').innerText = "학습 단어 생성 및 기록 저장";
    }

    function openHelpModal() {
        document.getElementById('helpModal').style.display = 'flex';
    }

    function closeHelpModal() {
        document.getElementById('helpModal').style.display = 'none';
    }

    function speakText(text, lang) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        window.speechSynthesis.speak(utterance);
    }

    function repeatSpeak(text, lang) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const u1 = new SpeechSynthesisUtterance(text);
        u1.lang = lang;
        const u2 = new SpeechSynthesisUtterance(text);
        u2.lang = lang;
        u1.onend = () => setTimeout(() => window.speechSynthesis.speak(u2), 300);
        window.speechSynthesis.speak(u1);
    }

    function playAllWords() {
        if (!currentLoadedWords || currentLoadedWords.length === 0) return;
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();

        const lang = document.getElementById('langSelect').value;
        let index = 0;

        function playNext() {
            if (index >= currentLoadedWords.length) return;
            const utterance = new SpeechSynthesisUtterance(currentLoadedWords[index].word);
            utterance.lang = lang;
            utterance.onend = () => {
                index++;
                setTimeout(playNext, 400);
            };
            window.speechSynthesis.speak(utterance);
        }
        playNext();
    }

    function formatDateTime(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        const h = String(date.getHours()).padStart(2, '0');
        const min = String(date.getMinutes()).padStart(2, '0');
        const s = String(date.getSeconds()).padStart(2, '0');
        return `${y}/${m}/${d} ${h}:${min}:${s}`;
    }

    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function loadWords() {
        if (!userApiKey) {
            alert("API 키가 등록되어 있지 않습니다.");
            return;
        }

        const langSelect = document.getElementById('langSelect');
        const levelSelect = document.getElementById('levelSelect');
        const studyTypeSelect = document.getElementById('studyTypeSelect');
        const situationSelect = document.getElementById('situationSelect');

        const selectedLang = langSelect.value;
        const selectedLevel = levelSelect.value;
        const selectedStudyType = studyTypeSelect.value;
        const selectedSituation = situationSelect.value;

        const langText = langSelect.options[langSelect.selectedIndex].text;
        const levelText = levelSelect.options[levelSelect.selectedIndex].text;
        const studyTypeText = studyTypeMap[selectedStudyType].label;
        const situationText = situationSelect.options[situationSelect.selectedIndex].text;

        const rawPool = wordDatabase[selectedSituation]?.[selectedLevel] || [];
        const preparedPool = studyTypeMap[selectedStudyType].build(shuffleArray(rawPool));
        const words = preparedPool.slice(0, 10);
        
        renderWordsAndHistory(words, langText, levelText, studyTypeText, situationText, selectedLang, selectedLevel, selectedStudyType, selectedSituation, true);
    }

    function renderWordsAndHistory(words, langText, levelText, studyTypeText, situationText, langVal, levelVal, studyTypeVal, sitVal, saveHistory) {
        currentLoadedWords = words;
        const container = document.getElementById('wordListContainer');
        container.innerHTML = '';

        words.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'word-card';
            card.innerHTML = `
                <div class="word-header">
                    <span class="word-title">${index + 1}. ${item.word} <small style="font-weight:normal; color:#586a7b;">(${item.meaning || '예문'})</small></span>
                    <div class="btn-group">
                        <button onclick="speakText('${item.word}', '${langVal}')">▶ 듣기</button>
                        <button onclick="repeatSpeak('${item.word}', '${langVal}')">↻ 반복</button>
                    </div>
                </div>
                <div class="writing-area">
                    <label>따라 쓰기 연습:</label>
                    <input type="text" class="writing-input" placeholder="여기에 적어보세요.">
                </div>
            `;
            container.appendChild(card);
        });

        document.getElementById('allRepeatBtn').disabled = false;

        if (saveHistory) {
            const now = new Date();
            const timeString = formatDateTime(now);
            const historyListContainer = document.getElementById('historyListContainer');
            
            if (historyListContainer.innerHTML.includes("기록이 없습니다.")) {
                historyListContainer.innerHTML = "";
            }

            const rowId = 'row_' + Date.now();
            const itemDiv = document.createElement('div');
            itemDiv.className = 'history-item';
            itemDiv.id = rowId;
            const wordsJson = encodeURIComponent(JSON.stringify(words));
            
            itemDiv.innerHTML = `
                <div class="history-content" onclick="studyAgain('${langVal}', '${levelVal}', '${studyTypeVal}', '${sitVal}', '${langText}', '${levelText}', '${studyTypeText}', '${situationText}', '${wordsJson}')">
                    <span class="history-time">${timeString}</span>
                    <div class="history-desc">[${langText}] ${levelText} / ${studyTypeText} / ${situationText}</div>
                </div>
                <button class="btn-delete-icon" onclick="deleteHistoryRow('${rowId}')" title="삭제">⌫</button>
            `;
            historyListContainer.prepend(itemDiv);
        }
    }

    function studyAgain(langVal, levelVal, studyTypeVal, sitVal, langText, levelText, studyTypeText, situationText, wordsJson) {
        document.getElementById('langSelect').value = langVal;
        document.getElementById('levelSelect').value = levelVal;
        document.getElementById('studyTypeSelect').value = studyTypeVal;
        document.getElementById('situationSelect').value = sitVal;

        const words = JSON.parse(decodeURIComponent(wordsJson));
        renderWordsAndHistory(words, langText, levelText, studyTypeText, situationText, langVal, levelVal, studyTypeVal, sitVal, false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteHistoryRow(rowId) {
        const item = document.getElementById(rowId);
        if (item) item.remove();
        const historyListContainer = document.getElementById('historyListContainer');
        if (historyListContainer.children.length === 0) {
            historyListContainer.innerHTML = '<div style="color: #6b7280; font-size: 13px; text-align: center; padding: 10px;">기록이 없습니다.</div>';
        }
    }
</script>
